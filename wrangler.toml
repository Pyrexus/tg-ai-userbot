name = "tg-ai-userbot"
main = "src/index.ts"
compatibility_date = "2025-09-01"
compatibility_flags = ["nodejs_compat"]

[vars]
GROQ_MODELS = "qwen/qwen3.8-27b,openai/gpt-oss-120b"
QUOTE_API_URL = "https://tg-quote-api.100coldice.workers.dev"

[[durable_objects.bindings]]
name = "USERBOT"
class_name = "Userbot"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["Userbot"]

[[d1_databases]]
binding = "DB"
database_name = "tg-ai-userbot-db"
database_id = ""   # Auto-provisioned by Cloudflare Deploy button, or create via: npx wrangler d1 create tg-ai-userbot-db

[triggers]
crons = ["*/5 * * * *"]   # 5-minute watchdog ping to keep solo userbot alive without quota exhaustion
